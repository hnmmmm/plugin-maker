<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; script-src 'self'">
  <title>플러그인 메이커</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app">


    <main id="main">
      <header id="topbar">
        <div class="title-box">
          <div class="brand" title="플러그인 메이커">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"><path d="M12 2.5l8.5 4.75v9.5L12 21.5l-8.5-4.75v-9.5z"/><path d="M3.5 7.25L12 12l8.5-4.75M12 12v9.5"/></svg>
          </div>
          <input id="project-name" value="내 플러그인" maxlength="40" spellcheck="false" title="클릭해서 이름을 바꿀 수 있습니다">
          <span id="dirty-dot" class="dirty off" title="저장하지 않은 변경이 있습니다">●</span>
          <button id="chip-version" class="chip-btn" title="버전/프로젝트 바꾸기">버전 고르기</button>
        </div>
        <div class="top-actions">
          <div class="mode" id="level-switch" title="간단 모드에서는 간단한 블록만 보입니다">
            <button class="mode-btn" data-v="easy">간단</button>
            <button class="mode-btn" data-v="all">전체</button>
          </div>
          <div class="mode">
            <button id="btn-mode-block" class="mode-btn on" title="블록을 쌓아서 만들기">블록</button>
            <button id="btn-mode-code" class="mode-btn" title="블록으로 만들어진 자바 코드 구경하기 (고칠 수는 없습니다)">코드 보기</button>
          </div>
          <span class="top-sep"></span>
          <button id="btn-templates" class="top-btn" title="완성된 예제를 골라서 넣습니다">예제</button>
          <button id="btn-open" class="top-btn" title="다른 프로젝트 열기 (Ctrl+O)">불러오기</button>
          <button id="btn-save" class="top-btn" title="저장하기 (Ctrl+S)">저장</button>
          <button id="btn-pack" class="top-btn" title="그림을 바꾼 아이템들을 리소스팩 zip 으로 만듭니다">리소스팩</button>
          <button id="btn-build" class="primary top-primary" title="서버에 넣을 파일(.jar)을 만듭니다">플러그인 만들기</button>
        </div>
      </header>

      <section id="ws-card">
        <div id="blockly"></div>
      </section>

      <section id="code-card" class="hidden">
        <pre id="code-view"></pre>
      </section>

      <div id="statusbar">
        <span id="status-text"></span>
        <span class="hint">자동 저장 · 블록을 팔레트로 끌어다 놓으면 지워집니다</span>
      </div>
    </main>

  </div>

  <textarea id="editor" class="hidden" readonly></textarea>

  <div id="tooltip"></div>
  <div id="toast-box"></div>
  <div id="notice-box"></div>
  <div id="start" class="overlay hidden"></div>
  <div id="export-modal" class="overlay hidden"></div>

  <script src="node_modules/blockly/blockly_compressed.js"></script>
  <script src="node_modules/blockly/msg/ko.js"></script>
  <script src="slots.js"></script>
  <script src="ui.js"></script>
  <script src="defs.js"></script>
  <script src="gen.js"></script>
  <script src="templates.js"></script>
  <script src="richtext.js"></script>
  <script src="picker.js"></script>
  <script src="mccatalog.js"></script>
  <script src="pixel.js"></script>
  <script src="designer.js"></script>
  <script src="workspace.js"></script>
  <script src="pack.js"></script>
  <script src="start.js"></script>
  <script src="easter.js"></script>
</body>
</html>
